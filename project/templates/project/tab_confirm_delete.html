<!-- tab_confirm_delete.html - confirm tab deletion -->
{% extends 'project/base.html' %}
{% block title %}Delete Tab - tabby{% endblock %}

{% block content %}
<h1>Delete Tab</h1>

<div class="card">
    <p>Are you sure you want to delete this tab for <strong>{{ object.song.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'project:tab_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
