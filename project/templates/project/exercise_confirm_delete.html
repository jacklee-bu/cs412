<!-- exercise_confirm_delete.html - confirm exercise deletion -->
{% extends 'project/base.html' %}
{% block title %}Delete Exercise - tabby{% endblock %}

{% block content %}
<h1>Delete Exercise</h1>

<div class="card">
    <p>Are you sure you want to delete <strong>{{ exercise.name }}</strong>?</p>
    <p class="meta">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'project:exercise_detail' exercise.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
