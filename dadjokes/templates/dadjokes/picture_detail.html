{% extends 'dadjokes/base.html' %}

{% block title %}Picture #{{ picture.pk }}{% endblock %}

{% block content %}
<div class="card">
    <h2>Picture #{{ picture.pk }}</h2>
    <div class="image-container">
        <img src="{{ picture.image_url }}" alt="Picture by {{ picture.name }}">
    </div>
    <p><em>Contributed by: {{ picture.name }}</em></p>
    <p style="color: #999; font-size: 0.9em;">Posted: {{ picture.timestamp }}</p>
</div>
{% endblock %}
